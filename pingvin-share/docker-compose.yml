name: "pingvin-share"
services:
  pingvin-share:
    container_name: pingvin-share
    image: stonith404/pingvin-share # or ghcr.io/stonith404/pingvin-share
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TRUST_PROXY=true # Set to true if a reverse proxy is in front of the container
    volumes:
      - "/mnt/storage/pingvin-share/data:/opt/app/backend/data"
      - "/mnt/storage/pingvin-share/data/images:/opt/app/frontend/public/img"

